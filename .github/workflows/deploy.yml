name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # Step 1 — Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 — Build and push server
      - name: Build and push server
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kicks-server:latest

      # Step 4 — Build and push client
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kicks-client:latest

      # Step 5 — Build and push admin
      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kicks-admin:latest

      # Step 6 — Build and push delivery-app
      - name: Build and push delivery
        uses: docker/build-push-action@v6
        with:
          context: .
          file: delivery-app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kicks-delivery:latest


